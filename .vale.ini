# Vale configuration for network-arbitrary.
# https://vale.sh/docs/topics/config/
#
# Rule-tuning policy: rules keep the severity their package ships, and
# prose is rewritten to comply rather than demoting a rule to silence
# it. The only exceptions are deduping rules that overlap across
# packages and exempting documents that aren't ours to restyle.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, proselint, alex
Vocab = network-arbitrary

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
proselint.Cliches = NO     # Microsoft.Terms covers the same ground
proselint.Spelling = NO    # Vale.Spelling owns spelling

# Shields.io badge markup renders as an image, so its label is a machine
# identifier rather than prose: it carries bare acronyms and product
# names that read as undefined or misspelled to a prose linter.
TokenIgnores = (\[!\[[^\]]*\]\([^)]*\)\]\([^)]*\))

# Exempt documents that aren't ours to restyle: CODE_OF_CONDUCT.md is the
# verbatim Contributor Covenant, and ChangeLog.md is a record of shipped
# releases naming tools and versions rather than prose where voice
# matters.
[{CODE_OF_CONDUCT,ChangeLog}.md]
BasedOnStyles =

# https://vale.sh/docs/topics/config/
#
# Rules keep the severity their package ships, and prose is rewritten to
# comply rather than demoting a rule to silence it.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, proselint, alex
Vocab = network-arbitrary

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
proselint.Cliches = NO     # Microsoft.Terms covers the same ground
proselint.Spelling = NO    # Vale.Spelling owns spelling

# A badge label renders as an image, not prose: bare acronyms and product
# names a linter reads as undefined or misspelled.
TokenIgnores = (\[!\[[^\]]*\]\([^)]*\)\]\([^)]*\))

# Not ours to restyle: CODE_OF_CONDUCT.md is the verbatim Contributor
# Covenant, ChangeLog.md a record of releases already shipped.
[{CODE_OF_CONDUCT,ChangeLog}.md]
BasedOnStyles =

name: Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"
      timezone: "Europe/London"
  # Pull requests run drift detection to test changes to this workflow before
  # merge. No paths filter: a required check must report on every pull request.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each pull request gets its own group so its run never waits on the
  # scheduled one or cancels another pull request's. Outside pull requests the
  # number is empty.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check GHC series drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      issue: ${{ steps.check.outputs.issue }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List tested GHC versions
        id: tested
        uses: ./.github/actions/tested-ghc
        with:
          versions-only: true

      # Policy (#112): test every GHC series that upstream hasn't
      # end-of-lifed.
      - name: Detect drift
        id: check
        env:
          TESTED: ${{ steps.tested.outputs.matrix }}
        run: |
          set -euo pipefail

          # An empty set means a source changed its format, so abort
          # instead of reporting drift.
          require_series() {
            if [ -z "$2" ]; then
              echo "no GHC series parsed from $1; aborting" >&2
              exit 1
            fi
          }

          expected=$(curl -fsSL https://endoflife.date/api/ghc.json \
            | jq -r 'map(select(.eol == false)) | .[].cycle' \
            | sort -V)
          require_series endoflife.date "$expected"

          tested=$(jq -r '.[]' <<< "$TESTED" | cut -d. -f1,2 | sort -uV)
          require_series tested-with "$tested"

          drift=false
          [ "$expected" = "$tested" ] || drift=true
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          [ "$drift" = true ] || exit 0

          join() { printf '%s' "$1" | paste -sd, -; }
          # create-an-issue reads the title and labels from front matter.
          cat > ghc-drift-issue.md <<EOF
          ---
          title: GHC series in tested-with out of date
          labels:
            - enhancement
          ---
          \`tested-with\` should track every GHC series that upstream
          hasn't end-of-lifed (policy: #112). CI builds its matrix from it.

          | Source | Series |
          | --- | --- |
          | Expected (endoflife.date) | $(join "$expected") |
          | \`tested-with\` (\`network-arbitrary.cabal\`) | $(join "$tested") |

          Update \`tested-with\`, then bump per PVP (CI/packaging-only is a
          patch).
          EOF

          delimiter=$(openssl rand -hex 16)
          {
            echo "issue<<$delimiter"
            cat ghc-drift-issue.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # Pull requests run detection but never file, so only this job holds
  # issues: write.
  file-drift-issue:
    name: File GHC series drift issue
    needs: drift
    if: >-
      needs.drift.outputs.drift == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Write drift issue
        env:
          ISSUE: ${{ needs.drift.outputs.issue }}
        run: printf '%s\n' "$ISSUE" > ghc-drift-issue.md

      # update_existing refreshes the open issue with the same title, so a
      # fixed title keeps every drift run on one issue.
      - name: File or refresh drift issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: ghc-drift-issue.md
          update_existing: true

  links:
    name: Check links
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.compose.outputs.issue }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Set up lychee
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: lychee

      # Scheduled runs report dead links through an issue instead of failing.
      # The token raises GitHub's rate limit for github.com links.
      - name: Check links
        id: lychee
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p lychee
          lychee --config lychee.toml --no-progress --mode task --format markdown './**/*.md' \
            | tee lychee/out.md "$GITHUB_STEP_SUMMARY"

      # create-an-issue reads the title and labels from front matter, which
      # lychee's report lacks.
      - name: Compose broken-links issue
        id: compose
        if: steps.lychee.outcome == 'failure'
        run: |
          set -euo pipefail

          cat > broken-links-issue.md <<'EOF'
          ---
          title: Broken links detected
          labels:
            - documentation
          ---
          EOF
          cat lychee/out.md >> broken-links-issue.md

          delimiter=$(openssl rand -hex 16)
          {
            echo "issue<<$delimiter"
            cat broken-links-issue.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  file-links-issue:
    name: File broken-links issue
    needs: links
    if: >-
      needs.links.outputs.issue != ''
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Write broken-links issue
        env:
          ISSUE: ${{ needs.links.outputs.issue }}
        run: printf '%s\n' "$ISSUE" > broken-links-issue.md

      - name: File or refresh broken-links issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: broken-links-issue.md
          update_existing: true

name: Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"
      timezone: "Europe/London"
  # Pull requests run drift detection to test changes to this workflow before
  # merge. No paths filter: a required check must report on every pull request.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each pull request gets its own group so its run never waits on the
  # scheduled one or cancels another pull request's. Outside pull requests the
  # number is empty.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check GHC matrix drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      issue: ${{ steps.check.outputs.issue }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Policy (#112): test every GHC series that upstream hasn't
      # end-of-lifed.
      - name: Detect drift
        id: check
        run: |
          set -euo pipefail

          ci_file=.github/workflows/ci.yml
          cabal_file=network-arbitrary.cabal

          # An empty set means a moved field or an upstream schema
          # change rather than a real drift, so abort the run.
          require_series() {
            if [ -z "$2" ]; then
              echo "no GHC series parsed from $1; aborting" >&2
              exit 1
            fi
          }

          expected=$(curl -fsSL https://endoflife.date/api/ghc.json \
            | jq -r 'map(select(.eol == false)) | .[].cycle' \
            | sort -V)
          require_series endoflife.date "$expected"

          matrix=$(yq '.jobs.build.strategy.matrix.ghc[]' "$ci_file" | sort -V)
          require_series "$ci_file" "$matrix"

          # tested-with spells each series as `>=X.Y && <X.Y+1`, so the
          # series are its lower bounds. grep exits 1 on no match and
          # pipefail would abort with no message, so `|| true` leaves the
          # empty set for require_series to report.
          tested=$(sed -n '/^tested-with:/,/^$/p' "$cabal_file" \
            | grep -oE '>=[0-9]+\.[0-9]+' \
            | grep -oE '[0-9]+\.[0-9]+' | sort -V || true)
          require_series "$cabal_file" "$tested"

          drift=false
          [ "$expected" = "$matrix" ] || drift=true
          [ "$expected" = "$tested" ] || drift=true
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          [ "$drift" = true ] || exit 0

          join() { printf '%s' "$1" | paste -sd, -; }
          # create-an-issue reads the title and labels from front matter.
          cat > ghc-drift-issue.md <<EOF
          ---
          title: GHC version matrix out of date
          labels:
            - enhancement
          ---
          The CI matrix and \`tested-with\` should track every GHC series
          that upstream hasn't end-of-lifed (policy: #112).

          | Source | Series |
          | --- | --- |
          | Expected (endoflife.date) | $(join "$expected") |
          | CI matrix (\`$ci_file\`) | $(join "$matrix") |
          | \`tested-with\` (\`$cabal_file\`) | $(join "$tested") |

          Update the matrix and \`tested-with\`, then bump per PVP
          (CI/packaging-only is a patch).
          EOF

          delimiter=$(openssl rand -hex 16)
          {
            echo "issue<<$delimiter"
            cat ghc-drift-issue.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # Filing is its own job so detection, which pull requests run, never holds
  # issues: write.
  file-drift-issue:
    name: File GHC matrix drift issue
    needs: drift
    if: >-
      needs.drift.outputs.drift == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Write drift issue
        env:
          ISSUE: ${{ needs.drift.outputs.issue }}
        run: printf '%s\n' "$ISSUE" > ghc-drift-issue.md

      # update_existing matches on title, so the drift job's fixed title keeps
      # every drift run on one issue instead of filing duplicates.
      - name: File or refresh drift issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: ghc-drift-issue.md
          update_existing: true

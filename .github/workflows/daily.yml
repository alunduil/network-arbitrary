name: Daily

# Offset from the hour: on-the-hour schedules queue behind platform peak load.
on:
  schedule:
    - cron: '47 6 * * *'
      timezone: Europe/London
  workflow_dispatch:
  # Pull requests dry-run the sweep to test changes to this workflow before
  # merge. No paths filter: a required check must report on every pull request.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Two sweeps in flight would both comment on the same pull request. Each pull
  # request gets its own group so its dry run never waits on the sweep or
  # cancels another pull request's. Outside pull requests the number is empty.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Without `actions`, a sweep cut off at operations-per-run restarts from
      # the first pull request instead of resuming, which is cheap here.
      issues: write
      pull-requests: write
    env:
      STALE_DAYS: 30
      CLOSE_DAYS: 14
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          debug-only: ${{ env.DRY_RUN }}
          # Disabling only marking would still close issues already labelled.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: ${{ env.STALE_DAYS }}
          days-before-pr-close: ${{ env.CLOSE_DAYS }}
          # Closing a Renovate pull request stops Renovate offering that
          # version. renovate.json applies this label.
          exempt-pr-labels: dependencies
          stale-pr-message: >-
            This has been quiet for ${{ env.STALE_DAYS }} days, so it's picked
            up a stale label. A comment or a push clears the label and restarts
            the clock. Otherwise this closes in another ${{ env.CLOSE_DAYS }}
            days.
          close-pr-message: >-
            Closing this after another ${{ env.CLOSE_DAYS }} quiet days. That
            isn't a call on the change itself, and nothing is lost: the branch
            stays where it is, so comment here if you want to pick it back up
            and I'll reopen it.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # get-tested runs a downloaded binary, so it stays out of the job that
  # holds the Hackage environment.
  ghc-version:
    name: Find the newest tested GHC
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      newest: ${{ fromJSON(steps.newest.outputs.matrix)[0] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find the newest GHC
        id: newest
        uses: ./.github/actions/tested-ghc
        with:
          newest: true
          versions-only: true

  publish:
    name: Publish to Hackage
    needs: ghc-version
    runs-on: ubuntu-26.04
    environment: hackage
    env:
      # renovate: datasource=github-tags depName=haskell/cabal versioning=loose extractVersion=^cabal-install-v(?<version>\d+\.\d+\.\d+\.\d+)$
      CABAL_VERSION: "3.18.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ needs.ghc-version.outputs.newest }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - name: cabal sdist
        run: cabal sdist
      - name: cabal upload
        env:
          HACKAGE_API_KEY: ${{ secrets.HACKAGE_API_KEY }}
        run: cabal upload --publish --token="$HACKAGE_API_KEY" dist-newstyle/sdist/*.tar.gz

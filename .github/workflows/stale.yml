name: Stale

# Offset from the hour: on-the-hour schedules queue behind platform peak load.
on:
  schedule:
    - cron: '47 6 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialise a dispatched run against the scheduled one: two sweeps in
  # flight would both comment on the same pull request.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # No `actions` scope, so the resume cache actions/stale keeps for
      # sweeps that exceed operations-per-run stays inert: its cache lookup
      # fails, is swallowed to a debug line, and every run re-scans from the
      # first pull request. Harmless until the sweep outgrows one run.
      issues: write
      pull-requests: write
    steps:
      # Both issue legs are disabled, not just marking: an issue already
      # carrying the label would otherwise stay eligible for closing.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          # Closing a Renovate pull request tells Renovate the version is
          # unwanted and it will not re-offer it. Renovate labels nothing by
          # default, so this depends on renovate.json applying the label.
          exempt-pr-labels: dependencies
          stale-pr-message: >-
            This has been quiet for 30 days, so it's picked up a stale label. A
            comment or a push clears the label and restarts the clock. Otherwise
            this closes in another 14 days.
          close-pr-message: >-
            Closing this after another 14 quiet days. That isn't a call on the
            change itself, and nothing is lost: the branch stays where it is, so
            comment here if you want to pick it back up and I'll reopen it.

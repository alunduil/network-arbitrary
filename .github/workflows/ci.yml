name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-tags depName=haskell/cabal versioning=loose extractVersion=^cabal-install-v(?<version>\d+\.\d+\.\d+\.\d+)$
  CABAL_VERSION: "3.18.2.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # tested-with in network-arbitrary.cabal is the only list of GHC versions.
  ghc-versions:
    name: List tested GHC versions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      newest: ${{ fromJSON(steps.newest.outputs.matrix)[0] }}

    # Renovate's regex manager only matches keys ending in _VERSION.
    env:
      # renovate: datasource=github-releases depName=Kleidukos/get-tested versioning=loose extractVersion=^v(?<version>.+)$
      GET_TESTED_VERSION: "0.1.10.0"
      # renovate: datasource=github-runners depName=ubuntu
      UBUNTU_VERSION: "26.04"
      # renovate: datasource=github-runners depName=macos
      MACOS_VERSION: "26"

    steps:
      - name: List the build matrix
        id: matrix
        uses: Kleidukos/get-tested@66e7d3233e529aee4a22ff5096288faa26f3fc28
        with:
          cabal-file: network-arbitrary.cabal
          version: ${{ env.GET_TESTED_VERSION }}
          ubuntu-version: ${{ env.UBUNTU_VERSION }}
          macos-version: ${{ env.MACOS_VERSION }}

      - name: Find the newest GHC
        id: newest
        uses: Kleidukos/get-tested@66e7d3233e529aee4a22ff5096288faa26f3fc28
        with:
          cabal-file: network-arbitrary.cabal
          version: ${{ env.GET_TESTED_VERSION }}
          newest: true
          versions-only: true

  build:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}
    needs: ghc-versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ghc-versions.outputs.matrix) }}

    env:
      # Package metadata and docs don't vary by GHC or OS.
      PACKAGE_CHECKS: ${{ matrix.newest && startsWith(matrix.os, 'ubuntu-') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC
        id: setup
        uses: ./.github/actions/setup-ghc
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      # Building from the sdist exercises the bare published bounds a
      # Hackage consumer faces, and catches a source or test file
      # missing from the tarball.
      - name: Build sdist
        run: cabal sdist all

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir sdist-build
          tar xf dist-newstyle/sdist/network-arbitrary-*.tar.gz \
            -C sdist-build --strip-components=1

      - name: Configure
        working-directory: sdist-build
        run: cabal configure --enable-tests

      - name: Install dependencies
        uses: ./.github/actions/cabal-dependencies
        with:
          working-directory: sdist-build
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}
          cabal-store: ${{ steps.setup.outputs.cabal-store }}

      - name: Build
        working-directory: sdist-build
        run: cabal build all

      - name: Test
        working-directory: sdist-build
        run: cabal test all --test-show-details=direct

      - name: Check package metadata
        if: env.PACKAGE_CHECKS == 'true'
        working-directory: sdist-build
        run: cabal check

      - name: Haddock
        if: env.PACKAGE_CHECKS == 'true'
        working-directory: sdist-build
        run: cabal haddock all

  coverage:
    name: Coverage
    needs: ghc-versions
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      # Step `if:` conditions can't read secrets, so the upload checks this copy.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC
        id: setup
        uses: ./.github/actions/setup-ghc
        with:
          ghc-version: ${{ needs.ghc-versions.outputs.newest }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      # Builds from the working tree, not the sdist: each .mix file
      # records its source path, and Codecov reports against src/.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage

      - name: Install dependencies
        uses: ./.github/actions/cabal-dependencies
        with:
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}
          cabal-store: ${{ steps.setup.outputs.cabal-store }}

      - name: Test with coverage
        run: cabal test all --test-show-details=direct

      # A new *Test module has to be listed here too, or it counts
      # toward library coverage. hpc-codecov matches literal names.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:test
          excludes: Main,Network.HTTP.Media.MediaType.ArbitraryTest,Network.HTTP.Types.Method.ArbitraryTest,Network.URI.ArbitraryTest

      # Pull requests from forks get no secrets, so skip the upload
      # rather than failing them on it.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true

  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Restore hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure --color=always

  # The devcontainer is ghcup's only consumer, so only this job catches a
  # ghcup release that installs but can't install GHC or cabal.
  devcontainer:
    name: Build the devcontainer
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # post-create.sh already fails the build when a tool won't install. It
      # never runs ghc, so runCmd checks that the user's PATH reaches it.
      - name: Build the devcontainer and check its tools
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: ghc --version

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Rulesets require this check by name, so renaming the job breaks the merge
  # gate. It reports every gating job under one name because the build's
  # per-cell check names change with the GHC matrix.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [ghc-versions, build, coverage, pre-commit, devcontainer, dependency-review]
    if: always()

    steps:
      # Pull-request-only jobs skip on a push to main.
      - name: Fail when any job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1

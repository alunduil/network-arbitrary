name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # GHC can't link on macos-26:
        # https://github.com/actions/runner-images/issues/14940
        os: [ubuntu-latest, macos-15]
        ghc: ["9.6", "9.8", "9.10", "9.12", "9.14"]
        include:
          # Metadata and docs don't vary by GHC or OS, and haddock is slow:
          # it rebuilds every dependency with documentation.
          - os: ubuntu-latest
            ghc: "9.14"
            package-checks: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC ${{ matrix.ghc }}
        id: setup
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Building from the sdist exercises the bare published bounds a
      # Hackage consumer faces, and catches a source or test file
      # missing from the tarball.
      - name: Build sdist
        run: cabal sdist all

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir sdist-build
          tar xf dist-newstyle/sdist/network-arbitrary-*.tar.gz \
            -C sdist-build --strip-components=1

      - name: Configure
        working-directory: sdist-build
        run: cabal configure --enable-tests

      - name: Install dependencies
        uses: ./.github/actions/cabal-dependencies
        with:
          working-directory: sdist-build
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}
          cabal-store: ${{ steps.setup.outputs.cabal-store }}

      - name: Build
        working-directory: sdist-build
        run: cabal build all

      - name: Test
        working-directory: sdist-build
        run: cabal test all --test-show-details=direct

      - name: Check package metadata
        if: matrix.package-checks
        working-directory: sdist-build
        run: cabal check

      - name: Haddock
        if: matrix.package-checks
        working-directory: sdist-build
        run: cabal haddock all

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The step condition below reads this rather than secrets directly,
    # which the steps context cannot see.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC
        id: setup
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14"
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Builds from the working tree, not the sdist: each .mix file
      # records its source path, and Codecov reports against src/.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage

      - name: Install dependencies
        uses: ./.github/actions/cabal-dependencies
        with:
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}
          cabal-store: ${{ steps.setup.outputs.cabal-store }}

      - name: Test with coverage
        run: cabal test all --test-show-details=direct

      # A new *Test module has to be listed here too, or it counts
      # toward library coverage. hpc-codecov matches literal names.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:test
          excludes: Main,Network.HTTP.Media.MediaType.ArbitraryTest,Network.HTTP.Types.Method.ArbitraryTest,Network.URI.ArbitraryTest

      # Pull requests from forks get no secrets, so skip the upload
      # rather than failing them on it. Errors uploading with a token
      # in hand still fail the job.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true

  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    # Sized for a cold cache, which rebuilds the Haskell hook environments.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      # The hlint hook's hlint-3.6.1 needs base <4.19, so GHC 9.6 at most.
      - name: Set up GHC
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.4.7"

      - name: Run pre-commit hooks
        uses: tox-dev/action-pre-commit-uv@4de52c139ed1a6963bcc4c30042c4ef9d75d8b11 # v1.1.0

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Rulesets require this check by name, so renaming the job breaks the merge
  # gate. It reports every gating job under one name because the build's
  # per-cell check names change with the GHC matrix.
  results:
    name: Check CI results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, coverage, pre-commit, dependency-review]
    if: always()

    steps:
      # Pull-request-only jobs skip on a push to main.
      - name: Fail when any job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1

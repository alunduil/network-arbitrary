name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-tags depName=haskell/cabal versioning=loose extractVersion=^cabal-install-v(?<version>\d+\.\d+\.\d+\.\d+)$
  CABAL_VERSION: "3.18.2.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: GHC ${{ matrix.ghc.GHC_VERSION }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-${{ matrix.OS_VERSION }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        # One entry per GHC series. Renovate bumps patch releases; the
        # weekly drift check flags series changes.
        ghc:
          - # renovate: datasource=github-tags depName=ghc/ghc
            GHC_VERSION: "9.6.7"
          - # renovate: datasource=github-tags depName=ghc/ghc
            GHC_VERSION: "9.8.4"
          - # renovate: datasource=github-tags depName=ghc/ghc
            GHC_VERSION: "9.10.3"
          - # renovate: datasource=github-tags depName=ghc/ghc
            GHC_VERSION: "9.12.4"
          - # renovate: datasource=github-tags depName=ghc/ghc
            GHC_VERSION: "9.14.1"
            package-checks: true
        include:
          - os: ubuntu
            # renovate: datasource=github-runners depName=ubuntu
            OS_VERSION: "26.04"
          - os: macos
            # GHC can't link on macos-26:
            # https://github.com/actions/runner-images/issues/14940
            # renovate: datasource=github-runners depName=macos
            OS_VERSION: "26"

    env:
      # Package metadata and docs don't vary by GHC or OS, so one cell
      # checks them.
      PACKAGE_CHECKS: ${{ matrix.ghc.package-checks && matrix.os == 'ubuntu' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC
        id: setup
        uses: ./.github/actions/setup-ghc
        with:
          ghc-version: ${{ matrix.ghc.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      # Building from the sdist exercises the bare published bounds a
      # Hackage consumer faces, and catches a source or test file
      # missing from the tarball.
      - name: Build sdist
        run: cabal sdist all

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir sdist-build
          tar xf dist-newstyle/sdist/network-arbitrary-*.tar.gz \
            -C sdist-build --strip-components=1

      - name: Configure
        working-directory: sdist-build
        run: cabal configure --enable-tests

      - name: Install dependencies
        uses: ./.github/actions/cabal-dependencies
        with:
          working-directory: sdist-build
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}
          cabal-store: ${{ steps.setup.outputs.cabal-store }}

      - name: Build
        working-directory: sdist-build
        run: cabal build all

      - name: Test
        working-directory: sdist-build
        run: cabal test all --test-show-details=direct

      - name: Check package metadata
        if: env.PACKAGE_CHECKS == 'true'
        working-directory: sdist-build
        run: cabal check

      - name: Haddock
        if: env.PACKAGE_CHECKS == 'true'
        working-directory: sdist-build
        run: cabal haddock all

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      # The step condition below reads this rather than secrets directly,
      # which the steps context cannot see.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # renovate: datasource=github-tags depName=ghc/ghc
      GHC_VERSION: "9.14.1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC
        id: setup
        uses: ./.github/actions/setup-ghc
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      # Builds from the working tree, not the sdist: each .mix file
      # records its source path, and Codecov reports against src/.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage

      - name: Install dependencies
        uses: ./.github/actions/cabal-dependencies
        with:
          ghc-version: ${{ steps.setup.outputs.ghc-version }}
          cabal-version: ${{ steps.setup.outputs.cabal-version }}
          cabal-store: ${{ steps.setup.outputs.cabal-store }}

      - name: Test with coverage
        run: cabal test all --test-show-details=direct

      # A new *Test module has to be listed here too, or it counts
      # toward library coverage. hpc-codecov matches literal names.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:test
          excludes: Main,Network.HTTP.Media.MediaType.ArbitraryTest,Network.HTTP.Types.Method.ArbitraryTest,Network.URI.ArbitraryTest

      # Pull requests from forks get no secrets, so skip the upload
      # rather than failing them on it.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true

  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Restore hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure --color=always

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Rulesets require this check by name, so renaming the job breaks the merge
  # gate. It reports every gating job under one name because the build's
  # per-cell check names change with the GHC matrix.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [build, coverage, pre-commit, dependency-review]
    if: always()

    steps:
      # Pull-request-only jobs skip on a push to main.
      - name: Fail when any job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1

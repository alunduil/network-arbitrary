name: Set up GHC
description: Install GHC and cabal-install with haskell-actions/setup, restoring both from the Actions cache.

inputs:
  ghc-version:
    description: An exact GHC release.
    required: true
  cabal-version:
    description: An exact cabal-install release.
    required: true

outputs:
  ghc-version:
    value: ${{ steps.setup.outputs.ghc-version }}
  cabal-version:
    value: ${{ steps.setup.outputs.cabal-version }}
  cabal-store:
    value: ${{ steps.setup.outputs.cabal-store }}

runs:
  using: composite
  steps:
    - name: Plan toolchain cache
      id: plan
      shell: bash
      env:
        GHC: ${{ inputs.ghc-version }}
        CABAL: ${{ inputs.cabal-version }}
      run: |
        ghcup="${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup"
        # Pull requests restore only caches saved on main, and runner
        # image patches roll out unevenly, so the key names the OS
        # release alone.
        key="ghcup-${ImageOS:?}-$RUNNER_ARCH"
        paths=()

        # plan TOOL VERSION PATH...: cache PATHs unless the image ships
        # TOOL VERSION. A shipped tool is already on disk, and restoring
        # over its root-owned directories makes tar fail, so the restore
        # reports a miss. Naming the source in the key makes an image
        # that stops shipping a tool miss rather than restore an entry
        # without it.
        plan() {
          local tool=$1 version=$2
          shift 2
          if [ -d "$ghcup/$tool/$version" ]; then
            key+="-$tool-$version-image"
          else
            key+="-$tool-$version-cache"
            paths+=("$@")
          fi
        }

        plan ghc "$GHC" "$ghcup/ghc/$GHC"
        # ghcup treats cabal-install without its db records as not
        # installed, then fails to reinstall over the restored files.
        plan cabal "$CABAL" "$ghcup/cabal/$CABAL" "$ghcup/db/cabal/$CABAL*"

        {
          echo "key=$key"
          echo "cacheable=$([ ${#paths[@]} -gt 0 ] && echo true || echo false)"
          echo "paths<<EOF"
          printf '%s\n' "${paths[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore toolchain
      id: cache
      if: steps.plan.outputs.cacheable == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}

    # setup counts a restored toolchain as installed only if this
    # directory exists, and restoring doesn't create it.
    - name: Prepare ghcup
      shell: bash
      run: mkdir -p "$HOME/.ghcup/bin"

    - name: Install toolchain
      id: setup
      uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
      with:
        ghc-version: ${{ inputs.ghc-version }}
        cabal-version: ${{ inputs.cabal-version }}
        # Callers update the index in their own step.
        cabal-update: false

    - name: Save toolchain
      if: steps.plan.outputs.cacheable == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

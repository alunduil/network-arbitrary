name: Set up GHC
description: Install GHC and cabal-install with haskell-actions/setup, restoring both from the Actions cache.

inputs:
  ghc-version:
    description: An exact GHC release.
    required: true
  cabal-version:
    description: An exact cabal-install release.
    required: true

outputs:
  ghc-version:
    value: ${{ steps.setup.outputs.ghc-version }}
  cabal-version:
    value: ${{ steps.setup.outputs.cabal-version }}
  cabal-store:
    value: ${{ steps.setup.outputs.cabal-store }}

runs:
  using: composite
  steps:
    - name: Plan toolchain cache
      id: plan
      shell: bash
      env:
        GHC: ${{ inputs.ghc-version }}
        CABAL: ${{ inputs.cabal-version }}
      run: |
        ghcup="${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup"
        paths=()
        # A tool the runner image ships is already on disk, so caching it
        # only spends cache budget. Restoring over it also fails: the
        # image's directories are root-owned, so tar exits non-zero and
        # the restore reports a miss.
        if [ -d "$ghcup/ghc/$GHC" ]; then
          ghc_source=image
        else
          ghc_source=cache
          paths+=("$ghcup/ghc/$GHC")
        fi
        if [ -d "$ghcup/cabal/$CABAL" ]; then
          cabal_source=image
        else
          cabal_source=cache
          # ghcup treats cabal-install without its db records as not
          # installed, then fails to reinstall over the restored files.
          paths+=("$ghcup/cabal/$CABAL" "$ghcup/db/cabal/$CABAL*")
        fi
        # Pull requests restore only caches saved on main, and runner
        # image patches roll out unevenly, so the key names the OS
        # release alone. The sources make an image that stops shipping
        # a tool miss rather than restore an entry without it.
        key="ghcup-${ImageOS:?}-$RUNNER_ARCH-ghc-$GHC-$ghc_source-cabal-$CABAL-$cabal_source"
        {
          echo "key=$key"
          echo "cached=$([ ${#paths[@]} -gt 0 ] && echo true || echo false)"
          echo "paths<<EOF"
          printf '%s\n' "${paths[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore toolchain
      id: cache
      if: steps.plan.outputs.cached == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}

    # setup counts a restored toolchain as installed only if this
    # directory exists, and restoring doesn't create it.
    - name: Prepare ghcup
      shell: bash
      run: mkdir -p "$HOME/.ghcup/bin"

    - name: Install toolchain
      id: setup
      uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
      with:
        ghc-version: ${{ inputs.ghc-version }}
        cabal-version: ${{ inputs.cabal-version }}
        # Callers update the index in their own step.
        cabal-update: false

    - name: Save toolchain
      if: steps.plan.outputs.cached == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

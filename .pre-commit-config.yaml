# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.201.1
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]
  # hlint and ormolu are invoked from PATH. Renovate's pre-commit manager only
  # tracks third-party hooks with a `rev:` field, so the pinned versions for
  # these tools live in `.github/workflows/pre-commit.yml`.
  - repo: local
    hooks:
      - id: hlint
        name: hlint
        entry: hlint
        language: system
        types_or: ["haskell", "literate-haskell"]
      - id: cabal check
        name: cabal check
        entry: cabal check
        language: system
        files: '\.cabal$'
        pass_filenames: false
      - id: ormolu
        name: ormolu
        entry: ormolu
        language: system
        types_or: ["haskell", "literate-haskell"]
        args: ["-i", "-c"]

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# .vale/styles/ is vendored by `vale sync`; only config/ (our vocabulary)
# is ours.
exclude: ^\.vale/styles/(?!config/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Styles are vendored under .vale/styles (see the top-level exclude),
  # so the hook needs no `vale sync` step.
  - repo: https://github.com/errata-ai/vale
    rev: v3.25.1
    hooks:
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        types: [markdown]
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.190.2
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]
  # Versions are pinned in the pre-commit job of `.github/workflows/ci.yml`;
  # Renovate's pre-commit manager tracks only hooks with a `rev:`.
  - repo: local
    hooks:
      - id: hlint
        name: hlint
        entry: hlint
        language: system
        types_or: ["haskell", "literate-haskell"]
      - id: cabal check
        name: cabal check
        entry: cabal check
        language: system
        files: '\.cabal$'
        pass_filenames: false
      - id: ormolu
        name: ormolu
        entry: ormolu
        language: system
        types_or: ["haskell", "literate-haskell"]
        args: ["-i", "-c"]

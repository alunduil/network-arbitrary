[settings]
locked = true
lockfile_platforms = ["linux-x64"]

# mise's registry has no aqua entry for hlint or ormolu.
[tools]
"github:ndmitchell/hlint" = "3.10"
"github:tweag/ormolu" = "0.9.0.0"
prek = "0.5.7"
# GHC and cabal stay off mise; the devcontainer installs them with ghcup.
ghcup = "0.2.6.2"
